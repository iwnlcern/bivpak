name: s2-harness

on:
  pull_request:
  push:

jobs:
  publish-toolchain-mirror:
    if: github.ref == 'refs/heads/s3-pack/portability'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upload remaining verified clang-tidy-22 mirror assets
        shell: bash
        run: |
          set -euo pipefail

          readonly RELEASE_TAG="toolchain-mirror-clang-tidy-22"
          readonly SOURCE_BASE="https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-22"
          readonly MIRROR_DIR="/tmp/llvm22-mirror"
          mkdir -p "$MIRROR_DIR"

          cat > "$MIRROR_DIR/SHA256SUMS" <<'EOF'
          05215c729cd18307e2bbfb710505b034e3ced630f68e146d4c0762877073c085  clang-tools-22_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          a722846476ee806a76710eea0c8cc63b18082b55eac8e2c6f092b7495a054240  libclang-common-22-dev_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          4c558366775f03a236a98a3e26f0f09ffab9d5df32c40050cee94c7aeca1ca44  libclang-cpp22_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          8488e5d288780d269c3516855247542f269bafafc55699502625f3ebdabce73b  libclang1-22_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          061b48c5a47589db2ee24bcba17aebb258c973bfa41e5bdc8e46a64ea4244ceb  libllvm22_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          f397059ac1ab2a8ea2a5707d7eec2dac6724f2f141e4668b75d08da62dd4280a  llvm-22-linker-tools_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb
          EOF

          while read -r _ filename; do
            curl --fail --silent --show-error --location \
              --output "$MIRROR_DIR/$filename" "$SOURCE_BASE/$filename"
          done < "$MIRROR_DIR/SHA256SUMS"
          (cd "$MIRROR_DIR" && sha256sum --check --strict SHA256SUMS)

          while read -r _ filename; do
            upload_name=${filename//\~/.}
            cp "$MIRROR_DIR/$filename" "$MIRROR_DIR/$upload_name"
            gh release upload "$RELEASE_TAG" "$MIRROR_DIR/$upload_name" \
              --repo "$GITHUB_REPOSITORY"
          done < "$MIRROR_DIR/SHA256SUMS"

  harness-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: |
          python -m venv .venv-harness
          .venv-harness/bin/python -m pip install -r harness/requirements.lock
      - name: Configure harness
        run: cmake -S harness -B harness/build/ci
      - name: Enforce generic core adapter purity
        run: python harness/ci/check_core_adapter_purity.py
      - name: Run harness-selftest
        run: ctest --test-dir harness/build/ci -R harness-selftest --output-on-failure

  safety-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register safety-fuzz-smoke gate
        run: echo "safety-fuzz-smoke is exercised in the integrated s2-core CMake tree when fuzz targets are present."

  build-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Assert Darwin arm64 runner
        run: |
          test "$(uname -s)" = "Darwin" || { echo "not Darwin"; exit 1; }
          test "$(uname -m)" = "arm64" || { echo "not arm64 - the E3 run host is arm64"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: |
          python -m venv .venv-harness
          .venv-harness/bin/python -m pip install -r harness/requirements.lock
      - name: Configure macOS product
        run: cmake --preset ci-macos
      - name: Build macOS product
        run: cmake --build --preset ci-macos
      - name: Run macOS product and harness rows
        run: ctest --preset ci-macos -R '^(biv_tests|harness-selftest|harness-e2)$' --output-on-failure
      - name: Enforce macOS Catch2 counts and skip identity
        run: |
          ./build/ci-macos/biv_tests -r xml > catch.xml
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("catch.xml").getroot()
          cases = root.find("OverallResultsCases")
          got = {
              key: int(cases.get(key, 0))
              for key in ("successes", "failures", "expectedFailures", "skips")
          }
          want = {
              "successes": 135,
              "failures": 0,
              "expectedFailures": 0,
              "skips": 2,
          }
          expected_skips = {
              "pack derives relpath from slash-form Windows extended paths",
              "pack computes foreign-flavor session relpaths without host path parsing",
          }
          skipped = {
              test_case.get("name"): (test_case.find("Skip").text or "").strip()
              for test_case in root.iter("TestCase")
              if test_case.find("Skip") is not None
          }

          print("catch2 cases:", got)
          print("skipped cases:")
          for name, reason in sorted(skipped.items()):
              print(f' - "{name}" ({reason})')

          if got != want:
              sys.exit(f"COUNT GATE FAILED: expected {want}, got {got}")
          if set(skipped) != expected_skips:
              sys.exit(
                  "SKIP-IDENTITY GATE FAILED: "
                  f"expected {expected_skips}, got {set(skipped)}"
              )
          PY
      - name: Show macOS portability case execution
        run: |
          FILTER='*secure_random_bytes*,*stat_mtime*,*scan*,*pack*,*Claude install*,*Codex install*'
          for pattern in '*secure_random_bytes*' '*stat_mtime*' '*scan*' '*pack*' '*Claude install*' '*Codex install*'; do
            count=$(./build/ci-macos/biv_tests "$pattern" --list-tests 2>/dev/null | sed -n 's/^\([0-9]*\) matching test cases*/\1/p')
            [ "${count:-0}" -gt 0 ] || { echo "EMPTY CATEGORY: $pattern selects 0 cases - false proof"; exit 1; }
          done
          ./build/ci-macos/biv_tests "$FILTER" --list-tests
          ./build/ci-macos/biv_tests "$FILTER" --reporter compact

  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision pinned clang-tidy-22 capability probe
        shell: bash
        run: |
          set -euo pipefail

          readonly LLVM_APT_SUITE="llvm-toolchain-noble-22"
          readonly LLVM_TIDY_VERSION="1:22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78"
          readonly LLVM_TIDY_DEB="clang-tidy-22_22.1.8~++20260613092238+e80beda6e255-1~exp1~20260613092253.78_amd64.deb"
          readonly LLVM_TIDY_SHA256="1e5917c1cd027548aff5cd35ee4f781a867d5daf03d9eb92611fc838ae9fa3dc"
          readonly LLVM_APT_KEY_FINGERPRINT="6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          readonly LLVM_TIDY_URL="https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-22/${LLVM_TIDY_DEB}"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg

          curl --fail --silent --show-error --location \
            --output /tmp/llvm-snapshot.gpg.key \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          observed_fingerprint=$(gpg --batch --show-keys --with-colons /tmp/llvm-snapshot.gpg.key \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$observed_fingerprint" = "$LLVM_APT_KEY_FINGERPRINT" || {
            echo "apt.llvm.org signing-key mismatch: expected $LLVM_APT_KEY_FINGERPRINT, got $observed_fingerprint"
            exit 1
          }
          gpg --batch --yes --dearmor \
            --output /tmp/llvm-archive-keyring.gpg /tmp/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-archive-keyring.gpg /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ ${LLVM_APT_SUITE} main" \
            | sudo tee /etc/apt/sources.list.d/llvm22.list >/dev/null
          sudo apt-get update

          curl --fail --silent --show-error --location \
            --output "/tmp/${LLVM_TIDY_DEB}" "$LLVM_TIDY_URL"
          echo "${LLVM_TIDY_SHA256}  /tmp/${LLVM_TIDY_DEB}" | sha256sum --check --strict
          packaged_version=$(dpkg-deb --field "/tmp/${LLVM_TIDY_DEB}" Version)
          test "$packaged_version" = "$LLVM_TIDY_VERSION" || {
            echo "clang-tidy-22 package mismatch: expected $LLVM_TIDY_VERSION, got $packaged_version"
            exit 1
          }

          sudo apt-get install -y --no-install-recommends "/tmp/${LLVM_TIDY_DEB}"
          installed_version=$(dpkg-query --show --showformat='${Version}' clang-tidy-22)
          test "$installed_version" = "$LLVM_TIDY_VERSION" || {
            echo "clang-tidy-22 install mismatch: expected $LLVM_TIDY_VERSION, got $installed_version"
            exit 1
          }
          version_output=$(clang-tidy-22 --version)
          printf '%s\n' "$version_output"
          observed_major=$(sed -nE 's/.*LLVM version ([0-9]+).*/\1/p' <<<"$version_output" | head -n 1)
          test "$observed_major" = "22" || {
            echo "clang-tidy-22 major mismatch: expected 22, got ${observed_major:-<empty>}"
            exit 1
          }
      - name: Install harness dependencies
        run: |
          python -m venv .venv-harness
          .venv-harness/bin/python -m pip install -r harness/requirements.lock
      - name: Provision writable WSL fixture root
        run: |
          sudo mkdir -p /mnt/c/tmp
          sudo chown -R "$(id -u):$(id -g)" /mnt/c
          test -w /mnt/c/tmp || { echo "/mnt/c not writable - the cross-flavor cases cannot run"; exit 1; }
      - name: Configure Linux product
        run: cmake --preset ci -DBIVHARNESS_REQUIRE_CLANG_TIDY=ON
      - name: Build Linux product
        run: cmake --build --preset ci
      - name: Run full Linux product and harness suite
        run: |
          JUNIT="$GITHUB_WORKSPACE/ctest.xml"
          ctest_rc=0
          ctest --preset ci --output-junit "$JUNIT" --output-on-failure || ctest_rc=$?

          tidy_gate_rc=0
          python3 - "$JUNIT" <<'PY' || tidy_gate_rc=$?
          import sys
          import xml.etree.ElementTree as ET

          ROW = "safety-tidy-analyzer"
          cases = [
              tc
              for tc in ET.parse(sys.argv[1]).getroot().iter("testcase")
              if tc.get("name") == ROW
          ]
          if len(cases) != 1:
              sys.exit(
                  f"TIDY ROW GATE FAILED: expected exactly 1 '{ROW}' record, "
                  f"found {len(cases)}. ABSENT/NOT-SELECTED is a false green: "
                  "the row cannot protect what it never ran on."
              )
          tc = cases[0]
          kids = {child.tag for child in tc}
          status = tc.get("status")
          if "skipped" in kids or status == "notrun":
              sys.exit(
                  f"TIDY ROW GATE FAILED: '{ROW}' was SKIPPED (status={status!r}). "
                  "ctest exits 0 on the skip arm - this IS the false green "
                  "Task 0d exists to remove."
              )
          if "failure" in kids or "error" in kids:
              sys.exit(
                  f"TIDY ROW GATE FAILED: '{ROW}' RAN and FAILED "
                  f"(status={status!r})."
              )
          if status != "run":
              sys.exit(
                  f"TIDY ROW GATE FAILED: '{ROW}' status={status!r}, "
                  "expected 'run'."
              )
          print(
              f"tidy row gate: OK - '{ROW}' EXECUTED and PASSED "
              f"(status={status!r})."
          )
          PY

          if [ "$ctest_rc" -ne 0 ] || [ "$tidy_gate_rc" -ne 0 ]; then exit 1; fi
      - name: Enforce Linux Catch2 counts
        run: |
          ./build/ci/biv_tests -r xml > catch.xml
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = ET.parse("catch.xml").getroot().find("OverallResultsCases")
          got = {
              key: int(cases.get(key, 0))
              for key in ("successes", "failures", "expectedFailures", "skips")
          }
          want = {
              "successes": 137,
              "failures": 0,
              "expectedFailures": 0,
              "skips": 0,
          }
          print("catch2 cases:", got)
          if got != want:
              sys.exit(f"COUNT GATE FAILED: expected {want}, got {got}")
          PY
