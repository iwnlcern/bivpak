name: s2-harness

on:
  pull_request:
  push:

jobs:
  harness-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: |
          python -m venv .venv-harness
          .venv-harness/bin/python -m pip install -r harness/requirements.lock
      - name: Configure harness
        run: cmake -S harness -B harness/build/ci
      - name: Run harness-selftest
        run: ctest --test-dir harness/build/ci -R harness-selftest --output-on-failure

  safety-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register safety-fuzz-smoke gate
        run: echo "safety-fuzz-smoke is exercised in the integrated s2-core CMake tree when fuzz targets are present."
