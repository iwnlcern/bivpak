name: internal-toolchain-mirror-publish

on:
  push:
    branches:
      - s3-pack/portability
    paths:
      - .github/workflows/internal-toolchain-mirror-publish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: toolchain-mirror-clang-tidy-22
      IMMUTABLE_TAG: toolchain-mirror-clang-tidy-22-immutable-v1
      TARGET_SHA: 5cf66629e005570cf4ebca2071117d2941f7ed1c
    steps:
      - name: Copy verified assets into an immutable release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$IMMUTABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $IMMUTABLE_TAG"
            exit 1
          fi

          mkdir assets
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' \
            --dir assets

          cat > assets/SHA256SUMS <<'EOF'
          c35ae50ecf7704b3dd0278837c4c223e72318e15de6869e3c73b58fbc64b547d  clang-22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          1e5917c1cd027548aff5cd35ee4f781a867d5daf03d9eb92611fc838ae9fa3dc  clang-tidy-22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          05215c729cd18307e2bbfb710505b034e3ced630f68e146d4c0762877073c085  clang-tools-22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          a722846476ee806a76710eea0c8cc63b18082b55eac8e2c6f092b7495a054240  libclang-common-22-dev_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          4c558366775f03a236a98a3e26f0f09ffab9d5df32c40050cee94c7aeca1ca44  libclang-cpp22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          8488e5d288780d269c3516855247542f269bafafc55699502625f3ebdabce73b  libclang1-22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          061b48c5a47589db2ee24bcba17aebb258c973bfa41e5bdc8e46a64ea4244ceb  libllvm22_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          f397059ac1ab2a8ea2a5707d7eec2dac6724f2f141e4668b75d08da62dd4280a  llvm-22-linker-tools_22.1.8.++20260613092238+e80beda6e255-1.exp1.20260613092253.78_amd64.deb
          EOF

          test "$(find assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 8
          (cd assets && sha256sum --check --strict SHA256SUMS)

          gh release create "$IMMUTABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$TARGET_SHA" \
            --title 'Internal immutable toolchain mirror: clang-tidy 22' \
            --notes 'Pinned LLVM 22.1.8 package closure for the S3 portability harness. Asset identity is enforced by the workflow SHA-256 manifest.'

          gh release upload "$IMMUTABLE_TAG" assets/*.deb \
            --repo "$GITHUB_REPOSITORY"

          test "$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${IMMUTABLE_TAG}" \
              --jq '.assets | length'
          )" -eq 8

          gh release edit "$IMMUTABLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          release_json=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${IMMUTABLE_TAG}")
          test "$(jq -r .immutable <<<"$release_json")" = true
          test "$(jq '.assets | length' <<<"$release_json")" -eq 8

          jq '{id, tag_name, immutable, draft, target_commitish, assets: [.assets[] | {name, digest, size}]}' \
            <<<"$release_json"
